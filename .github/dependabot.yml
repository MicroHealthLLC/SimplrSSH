# Keeps the GitHub Actions used by the workflows up to date. Actions are pinned
# to commit SHAs (supply-chain safety); Dependabot bumps the SHA and the version comment.
# (ESP-IDF components aren't supported by Dependabot; see the "Dependency check" workflow.)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
