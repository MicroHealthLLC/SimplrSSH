# Builds the LilyGO T-Deck (ESP32-S3) firmware and packages it as a single merged
# image, PocketSSH-v<version>-release.bin, to flash at offset 0x0 (DIO, 80 MHz, 16 MB).
#
# Releases: the version is PROJECT_VER in CMakeLists.txt. When a push to main carries a
# version that has no "v<version>" tag yet, this workflow creates the tag and a GitHub
# release with notes from README.md's Version History and the firmware image attached.
# Pushing a "v<version>" tag, or running the workflow manually on main, does the same.
# Other branches and pull requests only build.
name: Build firmware

on:
  push:
    branches: [main, integration]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  ESP_IDF_VERSION: v5.5.1

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read firmware version
        id: version
        run: |
          version=$(sed -n 's/^set(PROJECT_VER "\(.*\)").*/\1/p' CMakeLists.txt | tr -d '\r')
          if [ -z "$version" ]; then echo "::error file=CMakeLists.txt::PROJECT_VER not found"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Firmware version: $version"

      - name: Decide whether to release
        id: release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          release=false
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error file=CMakeLists.txt::Tag $GITHUB_REF_NAME does not match PROJECT_VER $VERSION"
              exit 1
            fi
            release=true
          elif [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "::notice file=CMakeLists.txt::$tag is already released. Bump PROJECT_VER and add a Version History entry to release again."
            else
              release=true
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Release $tag: $release"

      - name: Check release notes exist
        if: steps.release.outputs.release == 'true'
        run: python3 .github/scripts/release_notes.py "${{ steps.version.outputs.version }}" check.bin 0 /dev/null > /dev/null

      - name: Build and merge image (ESP-IDF ${{ env.ESP_IDF_VERSION }})
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5 # v1.2.0
        with:
          esp_idf_version: v5.5.1@sha256:dfa2d076c796769c07c155eba6c672b9f395aec943b2ba3701b73379b5f9e884  # espressif/idf:v5.5.1 pinned by digest
          target: esp32s3
          # The action wraps this in bash -c '...', so it must not contain single quotes
          command: >-
            set -o pipefail &&
            idf.py build 2>&1 | tee build-output.log &&
            idf.py merge-bin -o PocketSSH-v${{ steps.version.outputs.version }}-release.bin &&
            cd build &&
            sha256sum PocketSSH-v${{ steps.version.outputs.version }}-release.bin > PocketSSH-v${{ steps.version.outputs.version }}-release.bin.sha256

      - name: Summarize
        run: |
          bin=build/PocketSSH-v${{ steps.version.outputs.version }}-release.bin
          size=$(stat -c %s "$bin")
          {
            echo "## PocketSSH v${{ steps.version.outputs.version }}"
            echo ""
            echo "| File | Size | Flash at |"
            echo "|---|---|---|"
            echo "| \`$(basename "$bin")\` | $size bytes | \`0x0\` (DIO, 80 MHz, 16 MB) |"
            echo ""
            echo "SHA-256: \`$(cut -d' ' -f1 "$bin.sha256")\`"
            echo ""
            echo "Flash: \`esptool.py --chip esp32s3 --baud 921600 write_flash 0x0 $(basename "$bin")\`"
            if [ "${{ steps.release.outputs.release }}" = "true" ]; then
              echo ""
              echo "Releasing as **v${{ steps.version.outputs.version }}** (see the release job)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report compiler warnings (non-blocking)
        if: always()
        continue-on-error: true
        run: python3 .github/scripts/report_warnings.py build-output.log

      - name: Upload firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PocketSSH-v${{ steps.version.outputs.version }}
          path: |
            build/PocketSSH-v${{ steps.version.outputs.version }}-release.bin
            build/PocketSSH-v${{ steps.version.outputs.version }}-release.bin.sha256
            build/PocketSSH.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flash_args
          if-no-files-found: error

  release:
    if: needs.build.outputs.release == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.build.outputs.version }}
      IMAGE: PocketSSH-v${{ needs.build.outputs.version }}-release.bin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: PocketSSH-v${{ needs.build.outputs.version }}
          path: firmware

      - name: Skip if already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::v$VERSION was released by another run; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write release notes
        if: steps.exists.outputs.exists != 'true'
        run: |
          sha256=$(cut -d' ' -f1 "firmware/$IMAGE.sha256")
          python3 .github/scripts/release_notes.py "$VERSION" "$IMAGE" "$sha256" release-notes.md

      - name: Publish release v${{ needs.build.outputs.version }}
        if: steps.exists.outputs.exists != 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: PocketSSH v${{ needs.build.outputs.version }}
          body_path: release-notes.md
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            firmware/${{ env.IMAGE }}
            firmware/${{ env.IMAGE }}.sha256
