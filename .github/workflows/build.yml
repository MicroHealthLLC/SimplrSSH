# Builds the LilyGO T-Deck (ESP32-S3) firmware and packages it as two merged images:
#   - SimplrSSH-v<version>-release.bin, to flash at offset 0x0 (DIO, 80 MHz, 16 MB)
#   - SimplrSSH-v<version>-launcher.bin, to install with a launcher such as
#     bmorcelli/Launcher (same app, partitions_launcher.csv with the settings partition)
#
# Versions and releases (see .github/scripts/plan_release.py):
#   - Every push to main publishes a release, auto-incrementing the patch number from
#     the latest vX.Y.Z tag (v1.3.0 -> v1.3.1 -> v1.3.2 ...).
#   - "Run workflow" (manual) lets you pick the branch (main or integration), the bump
#     (patch by default, minor, major) or an exact version. Releases from integration
#     are marked as pre-releases.
#   - Pushing a tag vX.Y.Z releases exactly that version.
#   - Pushes to other branches and pull requests only build ("<next>-dev.<sha>").
name: Build firmware

on:
  push:
    branches: [main, integration]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build and release
        type: choice
        options: [main, integration]
        default: main
      bump:
        description: Version bump (ignored if a version is given)
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Exact version, e.g. 1.4.0 (optional - leave empty to auto-increment)
        type: string
        required: false

env:
  ESP_IDF_VERSION: v5.5.1

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Runs that can release (main, tags, manual) are serialized so two of them never pick
    # the same version; other builds are grouped per branch / pull request
    concurrency:
      group: >-
        build-${{ (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/')) && 'release' || github.ref }}
      cancel-in-progress: false
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || '' }}

      - name: Plan version and release
        id: plan
        env:
          INPUT_BRANCH: ${{ inputs.branch }}
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          python3 .github/scripts/plan_release.py
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Pull ESP-IDF image (retries transient registry errors)
        run: |
          for attempt in 1 2 3 4; do
            docker pull espressif/idf:v5.5.1@sha256:dfa2d076c796769c07c155eba6c672b9f395aec943b2ba3701b73379b5f9e884 && exit 0
            echo "Pull failed (attempt $attempt), retrying..."
            sleep $((attempt * 15))
          done
          exit 1

      - name: Build and merge image (ESP-IDF ${{ env.ESP_IDF_VERSION }})
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5 # v1.2.0
        with:
          esp_idf_version: v5.5.1@sha256:dfa2d076c796769c07c155eba6c672b9f395aec943b2ba3701b73379b5f9e884  # espressif/idf:v5.5.1 pinned by digest
          target: esp32s3
          # The version shown on the device and in the image name
          extra_docker_args: -e FIRMWARE_VERSION=${{ steps.plan.outputs.version }}
          # The action wraps this in bash -c '...', so it must not contain single quotes
          command: >-
            set -o pipefail &&
            idf.py build 2>&1 | tee build-output.log &&
            idf.py merge-bin -o SimplrSSH-v${{ steps.plan.outputs.version }}-release.bin &&
            idf.py launcher-bin &&
            cd build &&
            sha256sum SimplrSSH-v${{ steps.plan.outputs.version }}-release.bin > SimplrSSH-v${{ steps.plan.outputs.version }}-release.bin.sha256 &&
            sha256sum SimplrSSH-v${{ steps.plan.outputs.version }}-launcher.bin > SimplrSSH-v${{ steps.plan.outputs.version }}-launcher.bin.sha256

      - name: Summarize
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          RELEASE: ${{ steps.plan.outputs.release }}
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
        run: |
          bin="build/SimplrSSH-v$VERSION-release.bin"
          launcher="build/SimplrSSH-v$VERSION-launcher.bin"
          {
            echo "## SimplrSSH v$VERSION"
            echo ""
            echo "| File | Size | Install | SHA-256 |"
            echo "|---|---|---|---|"
            echo "| \`$(basename "$bin")\` | $(stat -c %s "$bin") bytes | flash at \`0x0\` (DIO, 80 MHz, 16 MB) | \`$(cut -d' ' -f1 "$bin.sha256")\` |"
            echo "| \`$(basename "$launcher")\` | $(stat -c %s "$launcher") bytes | with a launcher (bmorcelli/Launcher) | \`$(cut -d' ' -f1 "$launcher.sha256")\` |"
            echo ""
            echo "Flash: \`esptool.py --chip esp32s3 --baud 921600 write_flash 0x0 $(basename "$bin")\`"
            echo ""
            if [ "$RELEASE" = "true" ]; then
              kind=$([ "$PRERELEASE" = "true" ] && echo "pre-release" || echo "release")
              echo "Publishing **v$VERSION** as a $kind (see the release job)."
            else
              echo "Build only - no release for this event."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report compiler warnings (non-blocking)
        if: always()
        continue-on-error: true
        run: python3 .github/scripts/report_warnings.py build-output.log

      - name: Upload firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SimplrSSH-v${{ steps.plan.outputs.version }}
          path: |
            build/SimplrSSH-v${{ steps.plan.outputs.version }}-release.bin
            build/SimplrSSH-v${{ steps.plan.outputs.version }}-release.bin.sha256
            build/SimplrSSH-v${{ steps.plan.outputs.version }}-launcher.bin
            build/SimplrSSH-v${{ steps.plan.outputs.version }}-launcher.bin.sha256
            build/SimplrSSH.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/partition_table/partition-table-launcher.bin
            build/flash_args
          if-no-files-found: error

  release:
    if: needs.build.outputs.release == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ needs.build.outputs.tag }}
      IMAGE: SimplrSSH-v${{ needs.build.outputs.version }}-release.bin
      LAUNCHER_IMAGE: SimplrSSH-v${{ needs.build.outputs.version }}-launcher.bin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.build.outputs.sha }}

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Re-run the workflow to release the next version."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" != "tag" ] && git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag $TAG already exists without a release. Delete it or release a different version."
            exit 1
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: SimplrSSH-v${{ needs.build.outputs.version }}
          path: firmware

      - name: Write release notes
        run: |
          sha256=$(cut -d' ' -f1 "firmware/$IMAGE.sha256")
          launcher_sha256=$(cut -d' ' -f1 "firmware/$LAUNCHER_IMAGE.sha256")
          python3 .github/scripts/release_notes.py "$VERSION" "$IMAGE" "$sha256" \
            "$LAUNCHER_IMAGE" "$launcher_sha256" release-notes.md

      - name: Publish ${{ needs.build.outputs.tag }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ needs.build.outputs.sha }}
          name: SimplrSSH ${{ needs.build.outputs.tag }}
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.build.outputs.prerelease != 'true' }}
          fail_on_unmatched_files: true
          files: |
            firmware/${{ env.IMAGE }}
            firmware/${{ env.IMAGE }}.sha256
            firmware/${{ env.LAUNCHER_IMAGE }}
            firmware/${{ env.LAUNCHER_IMAGE }}.sha256
