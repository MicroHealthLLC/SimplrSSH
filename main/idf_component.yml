## IDF Component Manager Manifest File
## Direct dependencies are pinned to exact versions; dependencies.lock (project root)
## pins the transitive ones. Update both together: change a version here, then run
## `idf.py update-dependencies` and commit the new dependencies.lock.
dependencies:
  ## Required IDF version (CI builds with v5.5.1)
  idf:
    version: '~5.5.1'
  espressif/esp_bsp_generic: '3.1.1'
  espressif/esp_lcd_touch_gt911: '1.2.1'
  lvgl/lvgl: '9.4.0'
  skuodi/libssh2_esp: '1.1.0'
  espressif/esp_codec_dev: '1.6.2'   # ES7210 microphone codec (voice input)
